modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
logoFile = "nerodecor_logo.png"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
NeroDecor - multiloader build (NeoForge).
'''

[[mixins]]
config = "nerodecor-common.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Neroland Core — the ONLY hard dependency; shared foundation, must load BEFORE NeroDecor (ordering = AFTER).
[[dependencies.${mod_id}]]
modId = "nerolandcore"
type = "required"
versionRange = "${nerolandcore_version_range}"
ordering = "AFTER"
side = "BOTH"

# Optional synergy mods — NeroDecor functions fully without any of them. When present they load BEFORE
# NeroDecor so their Core tags / progression state / dashboard drivers are available; discovery is via
# Core tags + the shared contracts, never a hard import. External-mod interop stays dormant until those
# mods port to 26.1+.
[[dependencies.${mod_id}]]
modId = "nerospace"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "nerotech"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "nerocolonies"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "nerosecurity"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "nerologistics"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ae2"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "mekanism"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ad_astra"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "energizedpower"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
