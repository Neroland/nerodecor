// neoforge: full NeoForge userdev via ModDevGradle. Shares the common module's
// source directly (single copy -> no drift).
//
// 26.2 note: until NeoForge 26.2 is on the public Maven, self-build the 26.2.x
// branch (`./gradlew :neoforge:publishToMavenLocal`) and set neo_version_26.2 to
// the version it prints — mavenLocal() below resolves it.

plugins {
    id 'net.neoforged.moddev'
    id 'maven-publish'
}

// MC version comes from the Stonecutter node (e.g. :neoforge:26.1.2), not a global property.
def mc = stonecutter.current.version
def neoVersion = project.findProperty("neo_version_${mc}")
def jeiVersion = project.findProperty("jei_version_${mc}")
def emiFile = project.findProperty("emi_file_neoforge_${mc}")
// NeroLink bridge for dev runs only (never compiled against or published; skipped in CI and with -PnoNeroLink).
// NeroLink has no 1.21.x builds, so those cells skip it.
def nerolinkVersion = (mc.startsWith('1.') || System.getenv('CI') || project.hasProperty('noNeroLink')) ? null : project.findProperty('nerolink_version')
def nerolandcoreVersion = project.findProperty('nerolandcore_version')
// Minecraft range: 1.21.x cells are bounded to their API line (gradle.properties); 26.x keep [mc,).
def mcCeiling = project.findProperty("mc_ceiling_${mc}")
def mcFloor = project.findProperty("mc_floor_${mc}") ?: mc

// This node's projectDir is <loader>/versions/<v>; the authoritative loader source +
// templates live in the BRANCH root (neoforge/). Resolve branch-root paths via the parent.
def branchDir = project.parent.projectDir

// Distinct, descriptive jar name per cell (the node project is named after the MC version, so the
// default jar would be "<mc>-<version>.jar" and COLLIDE with the fabric cell of the same version).
base { archivesName = "nerodecor-neoforge-${mc}" }

// Publish this cell's jar as a Maven artifact so other Nero mods can declare NeroDecor a dependency:
// `za.co.neroland.nerodecor:nerodecor-neoforge-<mc>:<version>`. Mirrors Neroland Core's publishing setup.
// `./gradlew publishToMavenLocal` installs all nine cells locally for dev. Dependency-free POM on purpose.
publishing {
    publications {
        register('mod', MavenPublication) {
            groupId = rootProject.mod_group_id
            artifactId = "nerodecor-neoforge-${mc}"
            version = rootProject.mod_version
            artifact tasks.named('jar')
        }
    }
    // Remote target so a fresh CI runner / clone (empty ~/.m2) can resolve NeroDecor — GitHub Packages
    // Maven for the NeroDecor repo. `publishToMavenLocal` still works for local dev; `publish` (or
    // publishModPublicationToGitHubPackagesRepository) pushes here. Auth: gradle props gpr.user/gpr.key,
    // else env GITHUB_ACTOR/GITHUB_TOKEN (both present in GitHub Actions). Lazy getOrNull() means a
    // build that doesn't touch this repo (e.g. a contributor with no token) won't fail at configuration.
    // Privacy (POPIA/GDPR): publishes only build artifacts + version strings, no personal data.
    repositories {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/Neroland/nerodecor'
            credentials {
                username = providers.gradleProperty('gpr.user').orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrNull()
                password = providers.gradleProperty('gpr.key').orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrNull()
            }
        }
    }
}

repositories {
    mavenLocal() // resolves a self-built NeoForge 26.2 until the official jar drops
}

// Pull in the shared common source + resources.
sourceSets.main.java.srcDir rootProject.ext.commonJava
sourceSets.main.resources.srcDir rootProject.ext.commonResources

dependencies {
    // Neroland Core — the ONLY hard dependency. Resolved from mavenLocal() locally or the
    // NerolandCoreGitHubPackages repo in CI (nerolandcore-neoforge-<mc>). Core loads BEFORE NeroDecor
    // (see neoforge.mods.toml dependency, ordering = AFTER).
    implementation "za.co.neroland.nerolandcore:nerolandcore-neoforge-${mc}:${nerolandcoreVersion}"

    // NeroLink bridge in the dev client/server, so the companion app can pair with a dev world and read
    // NeroDecor's link module. runtimeOnly: NeroDecor never references NeroLink classes.
    if (nerolinkVersion) {
        runtimeOnly "za.co.neroland.nerolink:nerolink-neoforge-${mc}:${nerolinkVersion}"
    }

    // Sentry SDK embedded via NeoForge JarJar so players need no extra download (JarJar dedupes if
    // another mod also ships Sentry). Adds it to the compile classpath AND the mod jar.
    jarJar(implementation('io.sentry:sentry:8.60.0'))

    // JEI (optional recipe-viewer compat; the compat/jei plugin loads only when JEI is present). The API
    // is compile-time; the full NeoForge artifact is runtime-only (dev/test) so it is never published as a
    // hard dependency. Per-MC-version via jei_version_<mc> (BlameJared maven, inherited from the root).
    if (jeiVersion) {
        compileOnly "mezz.jei:jei-${mc}-common-api:${jeiVersion}"
        compileOnly "mezz.jei:jei-${mc}-neoforge-api:${jeiVersion}"
        runtimeOnly "mezz.jei:jei-${mc}-neoforge:${jeiVersion}"
    }

    // EMI (optional recipe-viewer compat). EMI ships one jar per loader with its API inside, so compile
    // against the whole jar; it is never published as a dependency. The dev client loads it only with
    // -PwithEmi, so default runs keep the plain JEI setup.
    if (emiFile) {
        compileOnly "curse.maven:emi-unofficial-port-unstable-1544558:${emiFile}"
        if (project.hasProperty('withEmi')) {
            runtimeOnly "curse.maven:emi-unofficial-port-unstable-1544558:${emiFile}"
        }
    }
}

// The recipe-viewer plugins (common compat/jei, compat/emi) compile only where that viewer's API is on the
// classpath for this Minecraft line (the 26.x pins above); elsewhere they are left out of the jar.
if (!jeiVersion) {
    sourceSets.main.java.exclude('za/co/neroland/nerodecor/compat/jei/**')
}
if (!emiFile) {
    sourceSets.main.java.exclude('za/co/neroland/nerodecor/compat/emi/**')
}

// Plain-JVM unit tests (JUnit 5, no game bootstrap). The shared tests live in common/src/test/java but,
// since `common` is not a Gradle project, each NeoForge node wires the source dir itself (stonecutter.gradle
// preprocesses it like main). Only the NeoForge nodes run them; `build`/`check` runs them automatically.
sourceSets.test.java.srcDir "${rootProject.projectDir}/common/src/test/java"

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Server GameTest harness - the 26.3 NeoForge cell only. A separate `gametest` source set (neoforge/src/gametest,
// its own neoforge.mods.toml, mod id nerodecor_gametest) loaded only by the gameTestServer run, so nothing in it
// reaches the shipped jar. Run: gradlew :neoforge:26.3:runGameTestServer (exits non-zero on a failed test).
def gameTests = mc == '26.3'
if (gameTests) {
    sourceSets {
        gametest {
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
        }
    }
    dependencies {
        // The link GameTests talk to Core's NeroLink registry directly (Core is already on the run classpath).
        gametestCompileOnly "za.co.neroland.nerolandcore:nerolandcore-neoforge-${mc}:${nerolandcoreVersion}"
    }
}

// Expand neoforge.mods.toml from src/main/templates into a generated resources dir
// (same pattern as the repo-root build). The template is NOT under src/main/resources,
// so the IDE never copies a RAW (token-laden) mods.toml into bin/main;
// neoForge.ideSyncTask runs this on IDE sync so bin/main gets the EXPANDED manifest
// and Run & Debug works — values stay dynamic (from gradle.properties).
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    // NeoForge 26.2 deprecated the `logoFile` property in favour of `bannerFile` (wide banner) and
    // `iconFile` (square icon); 26.2+ shows a dev-only warning screen for any mod still using it, while
    // 26.1.2's FML only understands `logoFile`. Our logo is a square 256x256 PNG, so emit `iconFile` on
    // 26.2+ and keep `logoFile` on 26.1.2 — one template, correct metadata on every cell, no warning.
    def mcParts = mc.tokenize('.').collect { it.toInteger() }
    def squareIconKey = mcParts[0] > 26 || (mcParts[0] == 26 && (mcParts.size() < 2 || mcParts[1] >= 2))
    def modLogoEntry = (squareIconKey ? 'iconFile' : 'logoFile') + ' = "nerodecor_logo.png"'

    def props = [
        mod_id                 : rootProject.mod_id,
        mod_version            : rootProject.mod_version,
        mod_name               : rootProject.mod_name,
        mod_authors            : rootProject.mod_authors,
        mod_license            : rootProject.mod_license,
        mod_logo_entry         : modLogoEntry,
        minecraft_version_range: mcCeiling ? "[${mcFloor},${mcCeiling})" : "[${mc},)",
        // Floor the required Core range at the compiled version (never a broad [1.0,2.0)) so the loader
        // refuses to run against a Core too old to have the APIs NeroDecor references.
        nerolandcore_version_range: "[${nerolandcoreVersion},2.0)",
    ]
    inputs.properties(props)
    expand(props)
    from "${branchDir}/src/main/templates"
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata

neoForge {
    version = neoVersion
    ideSyncTask generateModMetadata

    // Give the unit-test source set the same (de-obfuscated) Minecraft + NeoForge classpath as main.
    addModdingDependenciesTo sourceSets.test
    if (gameTests) {
        addModdingDependenciesTo sourceSets.gametest
    }

    def at = rootProject.file('common/src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    runs {
        client {
            client()
            gameDirectory = file('runs/client')
        }
        server {
            server()
            gameDirectory = file('runs/server')
        }
        if (gameTests) {
            gameTestServer {
                type = 'gameTestServer'
                gameDirectory = file('runs/gametest')
                systemProperty 'neoforge.enabledGameTestNamespaces', 'nerodecor_gametest'
            }
        }

        // Stop ModDevGradle from (re)generating absolute, machine-specific
        // "neoforge - Client/Server" entries into multiloader/.vscode/launch.json
        // on every Gradle/IDE sync. The committed relative configs
        // (${workspaceFolder} + preLaunchTask) are the source of truth.
        // Mirrors the root build's runs.configureEach { disableIdeRun() }.
        configureEach {
            disableIdeRun()
            // ModDevGradle run tasks IGNORE Gradle's `--debug-jvm` (unlike Fabric Loom), so VS Code
            // can't attach. Opt-in JDWP agent instead: the 'ML: Debug NeoForge ...' tasks pass
            // `-PnerodecorDebug`, which makes the game JVM suspend listening on :5005 so the matching
            // 'Debug: NeoForge ...' attach config can connect. No effect on normal runs/builds.
            if (project.hasProperty('nerodecorDebug')) {
                jvmArguments.add('-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=*:5005')
            }
        }
    }

    mods {
        "${rootProject.mod_id}" {
            sourceSet sourceSets.main
        }
        if (gameTests) {
            nerodecor_gametest {
                sourceSet sourceSets.gametest
            }
        }
    }
}

// The GameTest mod loads only in the gameTestServer run; client/server dev runs load NeroDecor alone.
if (gameTests) {
    neoForge.runs.configureEach { run ->
        run.loadedMods = run.name == 'gameTestServer'
                ? [neoForge.mods.nerodecor, neoForge.mods.nerodecor_gametest]
                : [neoForge.mods.nerodecor]
    }
}

// ecjCheck: run the Eclipse compiler (the SAME analyzer VS Code's Java extension uses) over the shared
// common + neoforge main sources, with the repo-root tools/ecj.prefs mirroring the IDE's diagnostic
// settings. Surfaces Problems-panel diagnostics (null analysis, unused members, unnecessary
// suppressions, ...) from the command line / gradle MCP. Warnings are reported in the log; the task only
// FAILS on real errors. The NeoForge module is analysed because its compile classpath resolves the full
// vanilla + NeoForge API (common alone is raw vanilla and won't resolve loader-facing references), and
// its main sourceSet already includes the common sources (srcDir above). Mirrors the repo-root ecjCheck.
configurations {
    ecj
}
dependencies {
    ecj 'org.eclipse.jdt:ecj:+'
}
tasks.register('ecjCheck', JavaExec) {
    group = 'verification'
    description = 'Run the Eclipse (IDE) analyzer over common + neoforge main sources and report its diagnostics.'
    notCompatibleWithConfigurationCache('assembles the analysis classpath at execution time')
    dependsOn tasks.named('compileJava')
    classpath = configurations.ecj
    mainClass = 'org.eclipse.jdt.internal.compiler.batch.Main'
    doFirst {
        def analysisCp = (sourceSets.main.compileClasspath.files + sourceSets.main.output.files)
                .findAll { it.exists() }
                .join(File.pathSeparator)
        // Pass the source FILES (not dirs) so the sourceSet excludes apply — e.g. the JEI/EMI plugins on
        // cells without those APIs — via an ecj @argfile to stay under the Windows command-line limit.
        def ecjSrcList = layout.buildDirectory.file('tmp/ecjCheck/sources.txt').get().asFile
        ecjSrcList.parentFile.mkdirs()
        ecjSrcList.text = sourceSets.main.java.files.collect { '"' + it.absolutePath.replace('\\', '/') + '"' }.join('\n')
        def srcDirs = ['@' + ecjSrcList.absolutePath]
        args = [
                '--release', "${project.javaRelease}",
                '-proc:none',
                '-d', 'none',
                '-properties', rootProject.file('tools/ecj.prefs').absolutePath,
                // No '-warn:' override — tools/ecj.prefs is the single source of truth for severities.
                // A CLI -warn:+token forces a category ON regardless of the prefs `ignore`, so the
                // framework-interop nullness categories would re-appear. nullanalysis=enabled in the
                // prefs already turns annotation-based analysis on for the genuine categories.
                '-annotationpath', 'CLASSPATH',
                '-classpath', analysisCp,
        ] + srcDirs
    }
}
